<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>최저가 모니터</title>
<meta name="color-scheme" content="light dark">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --page:#f9f9f7; --surface:#fcfcfb; --surface-2:#ffffff;
    --ink:#0b0b0b; --ink-2:#52514e; --ink-muted:#898781;
    --border:rgba(11,11,11,0.10); --grid:#e1e0d9; --baseline:#c3c2b7;
    --accent:#9c3b5e; --accent-ink:#ffffff; --accent-wash:rgba(156,59,94,0.08);
    --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
    --ch-own:#2a78d6; --ch-oy:#eb6834; --ch-coupang:#1baf7a; --ch-naver:#eda100;
    --radius:14px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --page:#0d0d0d; --surface:#1a1a19; --surface-2:#201f1e;
      --ink:#ffffff; --ink-2:#c3c2b7; --ink-muted:#898781;
      --border:rgba(255,255,255,0.12); --grid:#2c2c2a; --baseline:#383835;
      --accent:#c65683; --accent-ink:#1a1a19; --accent-wash:rgba(198,86,131,0.14);
      --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#e66767;
      --ch-own:#3987e5; --ch-oy:#d95926; --ch-coupang:#199e70; --ch-naver:#c98500;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --page:#0d0d0d; --surface:#1a1a19; --surface-2:#201f1e;
    --ink:#ffffff; --ink-2:#c3c2b7; --ink-muted:#898781;
    --border:rgba(255,255,255,0.12); --grid:#2c2c2a; --baseline:#383835;
    --accent:#c65683; --accent-ink:#1a1a19; --accent-wash:rgba(198,86,131,0.14);
    --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#e66767;
    --ch-own:#3987e5; --ch-oy:#d95926; --ch-coupang:#199e70; --ch-naver:#c98500;
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--page); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  .page{ max-width:1180px; margin:0 auto; padding:20px 16px 48px; display:flex; flex-direction:column; gap:20px; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
    padding-block:4px;
  }
  .brand{ display:flex; align-items:center; gap:12px; min-width:0; }
  .brand-mark{
    flex:none; width:40px; height:40px; border-radius:10px; background:var(--accent); color:var(--accent-ink);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; letter-spacing:0.02em;
  }
  .brand h1{ font-size:18px; margin:0; font-weight:700; }
  .brand .subtitle{ margin:2px 0 0; font-size:12.5px; color:var(--ink-muted); }
  .brand .subtitle.is-live{ color:var(--good); }
  .brand .subtitle.is-error{ color:var(--critical); }

  .upload-btn{
    display:inline-flex; align-items:center; gap:8px; padding:10px 16px; border-radius:999px;
    background:var(--accent); color:var(--accent-ink); font-size:13.5px; font-weight:600; cursor:pointer;
    border:1px solid transparent; white-space:nowrap;
  }
  .upload-btn:hover{ filter:brightness(1.06); }
  .upload-btn svg{ width:15px; height:15px; }
  .upload-row{ display:flex; align-items:center; gap:10px; }
  .file-name{ font-size:12px; color:var(--ink-muted); max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .kpis{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  .kpi{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px 16px; display:flex; flex-direction:column; gap:6px; min-width:0;
  }
  .kpi .label{ font-size:12px; color:var(--ink-muted); }
  .kpi .value{ font-size:26px; font-weight:700; letter-spacing:-0.01em; }
  .kpi .delta{ font-size:12px; font-weight:600; }
  .kpi .delta.up{ color:var(--critical); }
  .kpi .delta.down{ color:var(--good); }
  .kpi .delta.flat{ color:var(--ink-muted); }

  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; align-items:start; }
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px; display:flex; flex-direction:column; gap:12px; min-width:0;
  }
  .card.span-2{ grid-column:1 / -1; }
  .card-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .card-head h2{ font-size:14.5px; margin:0; font-weight:700; }

  input[type="search"], select{
    font:inherit; font-size:13px; padding:7px 10px; border-radius:8px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--ink);
  }
  input[type="search"]{ width:180px; }

  .table-wrap{ overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th, td{ padding:8px 10px; text-align:left; white-space:nowrap; border-bottom:1px solid var(--grid); }
  th{
    color:var(--ink-muted); font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:0.03em;
    cursor:pointer; user-select:none; position:sticky; top:0; background:var(--surface);
  }
  th.num, td.num{ text-align:right; font-variant-numeric:tabular-nums; }
  td.name{ white-space:normal; min-width:180px; }
  tbody tr:hover{ background:var(--accent-wash); }
  .sort-arrow{ opacity:0.5; margin-left:3px; }

  .chip{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; }
  .chip::before{ content:""; width:8px; height:8px; border-radius:50%; background:var(--chip-color,var(--ink-muted)); flex:none; }

  .badge{ display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600; padding:3px 8px; border-radius:999px; }
  .badge.good{ color:var(--good); background:color-mix(in srgb, var(--good) 14%, transparent); }
  .badge.critical{ color:var(--critical); background:color-mix(in srgb, var(--critical) 14%, transparent); }
  .badge.muted{ color:var(--ink-muted); background:color-mix(in srgb, var(--ink-muted) 12%, transparent); }

  .alert-list{ display:flex; flex-direction:column; gap:8px; max-height:360px; overflow-y:auto; }
  .alert-row{
    display:flex; flex-direction:column; gap:3px; padding:10px 12px; border-radius:10px;
    background:color-mix(in srgb, var(--critical) 8%, var(--surface));
    border:1px solid color-mix(in srgb, var(--critical) 24%, transparent);
  }
  .alert-row .name{ font-size:13px; font-weight:600; }
  .alert-row .meta{ font-size:12px; color:var(--ink-2); display:flex; gap:10px; flex-wrap:wrap; font-variant-numeric:tabular-nums; }
  .alert-row .gap{ color:var(--critical); font-weight:700; }
  .empty-note{ font-size:13px; color:var(--ink-muted); padding:18px 4px; text-align:center; }

  .chart-box{ position:relative; width:100%; }
  .chart-box svg{ width:100%; height:auto; display:block; overflow:visible; }
  .chart-box text{ fill:var(--ink-muted); font-size:10.5px; font-family:inherit; }
  .chart-box .value-label{ fill:var(--ink-2); font-weight:600; font-size:11px; }
  .tooltip{
    position:absolute; pointer-events:none; background:var(--surface-2); border:1px solid var(--border);
    border-radius:8px; padding:8px 10px; font-size:12px; box-shadow:0 4px 14px rgba(0,0,0,0.12);
    transform:translate(-50%,-110%); white-space:nowrap; z-index:5; opacity:0; transition:opacity .1s;
  }
  .tooltip .t-val{ font-weight:700; font-variant-numeric:tabular-nums; }
  .tooltip .t-date{ color:var(--ink-muted); font-size:11px; }

  .foot{ text-align:center; font-size:11.5px; color:var(--ink-muted); padding-top:8px; }

  @media (max-width:820px){
    .grid{ grid-template-columns:1fr; }
    .kpis{ grid-template-columns:1fr 1fr; }
    input[type="search"]{ width:130px; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">JH</div>
      <div>
        <h1>제니하우스 최저가 대시보드</h1>
        <p class="subtitle" id="statusLine">예시 데이터를 표시하고 있어요 · 엑셀을 업로드하면 실제 데이터로 바뀝니다</p>
      </div>
    </div>
    <div class="upload-row">
      <span class="file-name" id="fileName"></span>
      <label class="upload-btn" for="fileInput">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M12 4l-4 4M12 4l4 4"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
        <span>엑셀 업로드</span>
      </label>
      <input type="file" id="fileInput" accept=".xlsx,.xls" hidden>
    </div>
  </header>

  <section class="kpis" id="kpiRow"></section>

  <section class="grid">
    <div class="card span-2">
      <div class="card-head">
        <h2>전 상품 현재 최저가 현황판</h2>
        <input type="search" id="tableSearch" placeholder="상품명 검색">
      </div>
      <div class="table-wrap">
        <table id="priceTable">
          <thead><tr>
            <th data-key="no" class="num">No.<span class="sort-arrow"></span></th>
            <th data-key="name">상품명<span class="sort-arrow"></span></th>
            <th data-key="category">카테고리<span class="sort-arrow"></span></th>
            <th data-key="floor" class="num">마지노선가<span class="sort-arrow"></span></th>
            <th data-key="currentLow" class="num">현재 최저가<span class="sort-arrow"></span></th>
            <th data-key="lowChannel">최저채널<span class="sort-arrow"></span></th>
            <th data-key="status">상태<span class="sort-arrow"></span></th>
          </tr></thead>
          <tbody id="priceTableBody"></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h2>마지노선 이하 경고</h2></div>
      <div class="alert-list" id="alertList"></div>
    </div>

    <div class="card span-2">
      <div class="card-head">
        <h2>날짜별 가격 추이</h2>
        <select id="productSelect"></select>
      </div>
      <div class="chart-box" id="trendChart"></div>
    </div>

    <div class="card">
      <div class="card-head"><h2>채널별 최저가 분포</h2></div>
      <div class="chart-box" id="channelChart"></div>
    </div>

    <div class="card">
      <div class="card-head"><h2>카테고리별 경고 건수</h2></div>
      <div class="chart-box" id="categoryChart"></div>
    </div>
  </section>

  <p class="foot">엑셀을 업로드하면 팀 전체에 공유돼요 — 이후 이 링크로 들어오는 누구나 별도 업로드 없이 최신 데이터를 바로 보게 됩니다.</p>
</div>

<script>
(function(){
  "use strict";
  const SVGNS = "http://www.w3.org/2000/svg";
  const CHANNELS = ["자사몰","올리브영","쿠팡","네이버"];
  const CHANNEL_VAR = { "자사몰":"--ch-own", "올리브영":"--ch-oy", "쿠팡":"--ch-coupang", "네이버":"--ch-naver" };

  function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
  function won(n){ return (n==null || isNaN(n)) ? "-" : Math.round(n).toLocaleString("ko-KR") + "원"; }
  function num(n){ return (n==null || isNaN(n)) ? "-" : n.toLocaleString("ko-KR"); }
  function isAlert(r){
    if (r.status) return r.status.indexOf("이하") !== -1;
    return r.floor!=null && r.currentLow!=null && r.currentLow < r.floor;
  }
  // "nice" round-number axis scale (d3-style): given a raw data range, returns
  // a slightly wider [min,max] snapped to a clean step, plus the tick values.
  function niceScale(rawMin, rawMax, targetTicks){
    if (rawMin === rawMax) { rawMin -= 1000; rawMax += 1000; }
    const span = rawMax - rawMin;
    const rawStep = span / Math.max(targetTicks - 1, 1);
    const mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
    const norm = rawStep / mag;
    const niceNorm = norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10;
    const step = niceNorm * mag;
    const min = Math.floor(rawMin / step) * step;
    const max = Math.ceil(rawMax / step) * step;
    const ticks = [];
    for (let v = min; v <= max + step * 1e-6; v += step) ticks.push(v);
    return { min, max, step, ticks };
  }
  function svgEl(name, attrs){
    const e = document.createElementNS(SVGNS, name);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }
  function el(tag, attrs, text){
    const e = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      if (k === "class") e.className = attrs[k];
      else e.setAttribute(k, attrs[k]);
    }
    if (text != null) e.textContent = text;
    return e;
  }

  // ---------- sample data (shown until a real file is uploaded) ----------
  function sampleSnapshots(){
    const names = [
      {no:1, name:"제니하우스 살롱스파 리페어 샴푸 1000ML", category:"헤어케어(샴푸/트리트먼트)", floor:14500},
      {no:2, name:"제니하우스 살롱스파 스칼프 샴푸 1000ML", category:"헤어케어(샴푸/트리트먼트)", floor:14500},
      {no:9, name:"제니하우스 컬러케어 트리트먼트 500ML", category:"헤어케어(샴푸/트리트먼트)", floor:17500},
      {no:13,name:"제니하우스 데일리 헤어에센스", category:"헤어케어(에센스/오일)", floor:9800},
      {no:20,name:"제니하우스 볼륨업 헤어무스", category:"스타일링", floor:11800},
      {no:34,name:"제니하우스 헤어팩 300G", category:"헤어케어(팩/마스크)", floor:11500},
    ];
    const dates = ["2026-09-14","2026-09-15","2026-09-16"];
    const base = {1:18200,2:18200,9:18900,13:9600,20:12800,34:12300};
    const drift = {1:[0,0,-300],2:[0,-500,-500],9:[0,-900,-1800],13:[0,0,0],20:[0,300,300],34:[0,0,-1600]};
    const channelCycle = {1:"자사몰",2:"쿠팡",9:"쿠팡",13:"자사몰",20:"올리브영",34:"쿠팡"};
    return dates.map((d,di)=>({
      date:d,
      records:names.map(p=>{
        const low = base[p.no] + drift[p.no][di];
        return {
          no:p.no, name:p.name, category:p.category, floor:p.floor,
          currentLow: low, lowChannel: channelCycle[p.no],
          status: low < p.floor ? "⚠ 마지노선 이하" : "정상",
        };
      })
    }));
  }

  const state = { snapshots: sampleSnapshots(), usingSample: true, fileName: "", sort:{key:"no",dir:1}, search:"" };

  // ---------- excel parsing ----------
  function parseWorkbook(buf){
    const wb = XLSX.read(buf, {type:"array"});
    const snapshots = [];
    wb.SheetNames.forEach(sheetName=>{
      if (sheetName.indexOf("사용법") !== -1) return;
      const ws = wb.Sheets[sheetName];
      const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null});
      let headerIdx = -1, headerRow = null;
      for (let i=0;i<Math.min(rows.length,20);i++){
        const row = rows[i] || [];
        if (row.some(c => typeof c === "string" && c.trim() === "상품명")) { headerIdx = i; headerRow = row; break; }
      }
      if (headerIdx === -1) return;
      const idx = {};
      headerRow.forEach((c,j)=>{ if (typeof c === "string") idx[c.trim()] = j; });
      const need = ["No.","상품명","마지노선가","현재 최저가"];
      if (!need.every(k => k in idx)) return;
      const records = [];
      for (let i=headerIdx+1;i<rows.length;i++){
        const row = rows[i] || [];
        const noVal = row[idx["No."]];
        if (typeof noVal !== "number") continue;
        records.push({
          no: noVal,
          name: row[idx["상품명"]] != null ? String(row[idx["상품명"]]) : "",
          category: row[idx["카테고리"]] != null ? String(row[idx["카테고리"]]) : "",
          floor: typeof row[idx["마지노선가"]] === "number" ? row[idx["마지노선가"]] : null,
          currentLow: typeof row[idx["현재 최저가"]] === "number" ? row[idx["현재 최저가"]] : null,
          lowChannel: ("최저채널" in idx && typeof row[idx["최저채널"]] === "string") ? row[idx["최저채널"]] : null,
          status: ("상태" in idx && typeof row[idx["상태"]] === "string") ? row[idx["상태"]] : null,
        });
      }
      if (records.length) snapshots.push({date: String(sheetName), records});
    });
    const parsedDates = snapshots.map(s => Date.parse(s.date));
    if (snapshots.length && parsedDates.every(n => !Number.isNaN(n))) {
      snapshots.sort((a,b) => Date.parse(a.date) - Date.parse(b.date));
    }
    return snapshots;
  }

  const fileInput = document.getElementById("fileInput");
  const fileNameEl = document.getElementById("fileName");
  const statusLine = document.getElementById("statusLine");

  fileInput.addEventListener("change", function(e){
    const file = e.target.files[0];
    if (!file) return;
    // reset so re-selecting the SAME filename later (after re-editing it) still fires "change"
    e.target.value = "";
    file.arrayBuffer().then(function(buf){
      let snapshots;
      try { snapshots = parseWorkbook(buf); }
      catch(err){ snapshots = []; }
      if (!snapshots.length){
        statusLine.textContent = "이 파일에서 데이터를 찾지 못했어요 — 템플릿의 상품명·마지노선가·현재 최저가 열이 그대로 있는지 확인해주세요.";
        statusLine.className = "subtitle is-error";
        return;
      }
      state.snapshots = snapshots;
      state.usingSample = false;
      state.fileName = file.name;
      const latestDate = snapshots[snapshots.length-1].date;
      statusLine.textContent = "업로드한 파일 반영 중 · 기준일 " + latestDate + " (" + snapshots.length + "개 날짜 탭) · 팀 전체에 공유하는 중...";
      statusLine.className = "subtitle is-live";
      fileNameEl.textContent = file.name;
      populateProductSelect();
      renderAll();
      pushSnapshotToServer(snapshots, file.name, latestDate);
    });
  });

  // ---------- shared server sync (Cloudflare KV via /api/snapshot) ----------
  function pushSnapshotToServer(snapshots, fileName, latestDate){
    fetch("/api/snapshot", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ snapshots, fileName, updatedAt: new Date().toISOString() })
    }).then(function(res){
      if (!res.ok) throw new Error("save failed");
      statusLine.textContent = "실제 데이터 표시 중 (팀 전체 공유됨) · 기준일 " + latestDate + " (" + snapshots.length + "개 날짜 탭 반영)";
      statusLine.className = "subtitle is-live";
    }).catch(function(){
      statusLine.textContent = "화면엔 반영됐지만 팀 공유 저장에는 실패했어요 — 새로고침하면 이 내용이 사라질 수 있어요. 다시 시도해주세요.";
      statusLine.className = "subtitle is-error";
    });
  }

  function loadSnapshotFromServer(){
    fetch("/api/snapshot", { cache: "no-store" }).then(function(res){
      if (!res.ok) return null;
      return res.json();
    }).then(function(data){
      if (!data || !data.snapshots || !data.snapshots.length) return;
      state.snapshots = data.snapshots;
      state.usingSample = false;
      state.fileName = data.fileName || "";
      const latestDate = data.snapshots[data.snapshots.length-1].date;
      statusLine.textContent = "실제 데이터 표시 중 (팀 전체 공유됨) · 기준일 " + latestDate + " (" + data.snapshots.length + "개 날짜 탭 반영)" + (data.updatedAt ? " · 최근 업로드: " + new Date(data.updatedAt).toLocaleString("ko-KR") : "");
      statusLine.className = "subtitle is-live";
      if (data.fileName) fileNameEl.textContent = data.fileName;
      populateProductSelect();
      renderAll();
    }).catch(function(){ /* no shared data yet — keep showing sample */ });
  }

  // ---------- product select ----------
  const productSelect = document.getElementById("productSelect");
  function populateProductSelect(){
    const latest = state.snapshots[state.snapshots.length-1];
    const prevValue = productSelect.value;
    productSelect.innerHTML = "";
    latest.records.forEach(r=>{
      const opt = document.createElement("option");
      opt.value = String(r.no);
      opt.textContent = r.name;
      productSelect.appendChild(opt);
    });
    const stillExists = latest.records.some(r => String(r.no) === prevValue);
    if (stillExists) productSelect.value = prevValue;
    else {
      const firstAlert = latest.records.find(isAlert);
      productSelect.value = String((firstAlert || latest.records[0]).no);
    }
  }
  productSelect.addEventListener("change", renderTrendChart);

  // ---------- KPIs ----------
  function renderKPIs(){
    const kpiRow = document.getElementById("kpiRow");
    kpiRow.innerHTML = "";
    const latest = state.snapshots[state.snapshots.length-1];
    const prev = state.snapshots.length > 1 ? state.snapshots[state.snapshots.length-2] : null;
    const alertCount = latest.records.filter(isAlert).length;
    const prevAlertCount = prev ? prev.records.filter(isAlert).length : null;

    const tiles = [
      { label:"모니터링 상품 수", value: num(latest.records.length) },
      { label:"마지노선 이하 경고", value: num(alertCount), delta: prevAlertCount==null ? null : alertCount - prevAlertCount, deltaGoodDown:true },
      { label:"데이터 기준일", value: latest.date },
      { label:"불러온 날짜 탭 수", value: num(state.snapshots.length) },
    ];
    tiles.forEach(t=>{
      const card = el("div", {class:"kpi"});
      card.appendChild(el("div", {class:"label"}, t.label));
      card.appendChild(el("div", {class:"value"}, t.value));
      if (t.delta != null){
        let cls = "flat", txt = "전일과 동일";
        if (t.delta > 0){ cls = t.deltaGoodDown ? "up" : "down"; txt = "+" + t.delta + " (전일 대비)"; }
        else if (t.delta < 0){ cls = t.deltaGoodDown ? "down" : "up"; txt = t.delta + " (전일 대비)"; }
        card.appendChild(el("div", {class:"delta " + cls}, txt));
      }
      kpiRow.appendChild(card);
    });
  }

  // ---------- table ----------
  const tableBody = document.getElementById("priceTableBody");
  const tableSearch = document.getElementById("tableSearch");
  tableSearch.addEventListener("input", function(){ state.search = tableSearch.value; renderTable(); });
  document.querySelectorAll("#priceTable th[data-key]").forEach(th=>{
    th.addEventListener("click", function(){
      const key = th.getAttribute("data-key");
      if (state.sort.key === key) state.sort.dir *= -1;
      else { state.sort.key = key; state.sort.dir = 1; }
      renderTable();
    });
  });

  function statusBadge(r){
    if (isAlert(r)) return { cls:"critical", text:"⚠ 마지노선 이하" };
    if (r.currentLow != null && r.floor != null) return { cls:"good", text:"정상" };
    return { cls:"muted", text:"-" };
  }

  function renderTable(){
    const latest = state.snapshots[state.snapshots.length-1];
    const hasCategory = latest.records.some(r => r.category);
    const categoryTh = document.querySelector('#priceTable th[data-key="category"]');
    if (categoryTh) categoryTh.hidden = !hasCategory;

    let rows = latest.records.slice();
    const q = state.search.trim().toLowerCase();
    if (q) rows = rows.filter(r => r.name.toLowerCase().indexOf(q) !== -1);
    const { key, dir } = state.sort;
    rows.sort((a,b)=>{
      let av = a[key], bv = b[key];
      if (av == null) av = (typeof bv === "number") ? -Infinity : "";
      if (bv == null) bv = (typeof av === "number") ? -Infinity : "";
      if (typeof av === "string") return av.localeCompare(bv, "ko") * dir;
      return (av - bv) * dir;
    });

    document.querySelectorAll("#priceTable .sort-arrow").forEach(a => a.textContent = "");
    const activeTh = document.querySelector('#priceTable th[data-key="'+key+'"] .sort-arrow');
    if (activeTh) activeTh.textContent = dir === 1 ? "▲" : "▼";

    tableBody.innerHTML = "";
    if (!rows.length){
      const tr = el("tr");
      const td = el("td", {colspan: hasCategory ? "7" : "6", class:"empty-note"}, "검색 결과가 없어요");
      tr.appendChild(td); tableBody.appendChild(tr);
      return;
    }
    rows.forEach(r=>{
      const tr = el("tr");
      tr.appendChild(el("td", {class:"num"}, num(r.no)));
      tr.appendChild(el("td", {class:"name"}, r.name));
      if (hasCategory) tr.appendChild(el("td", null, r.category || "-"));
      tr.appendChild(el("td", {class:"num"}, won(r.floor)));
      tr.appendChild(el("td", {class:"num"}, won(r.currentLow)));

      const chTd = el("td");
      if (r.lowChannel){
        const chip = el("span", {class:"chip"}, r.lowChannel);
        chip.style.setProperty("--chip-color", "var(" + (CHANNEL_VAR[r.lowChannel] || "--ink-muted") + ")");
        chTd.appendChild(chip);
      } else { chTd.textContent = "-"; }
      tr.appendChild(chTd);

      const stTd = el("td");
      const b = statusBadge(r);
      stTd.appendChild(el("span", {class:"badge " + b.cls}, b.text));
      tr.appendChild(stTd);

      tableBody.appendChild(tr);
    });
  }

  // ---------- alert list ----------
  function renderAlerts(){
    const latest = state.snapshots[state.snapshots.length-1];
    const box = document.getElementById("alertList");
    box.innerHTML = "";
    const alerts = latest.records.filter(isAlert)
      .map(r => Object.assign({gap: (r.floor - r.currentLow)}, r))
      .sort((a,b) => b.gap - a.gap);
    if (!alerts.length){
      box.appendChild(el("div", {class:"empty-note"}, "마지노선 이하로 떨어진 상품이 없어요 🎉"));
      return;
    }
    alerts.forEach(r=>{
      const row = el("div", {class:"alert-row"});
      row.appendChild(el("div", {class:"name"}, r.name));
      const meta = el("div", {class:"meta"});
      meta.appendChild(el("span", null, "마지노선 " + won(r.floor)));
      meta.appendChild(el("span", null, "현재 " + won(r.currentLow)));
      const gapSpan = el("span", {class:"gap"}, "-" + won(r.gap));
      meta.appendChild(gapSpan);
      if (r.lowChannel) meta.appendChild(el("span", null, r.lowChannel));
      row.appendChild(meta);
      box.appendChild(row);
    });
  }

  // ---------- trend chart ----------
  function renderTrendChart(){
    const box = document.getElementById("trendChart");
    box.innerHTML = "";
    const no = Number(productSelect.value);
    const series = state.snapshots.map(s => ({ date:s.date, rec: s.records.find(r => r.no === no) }));
    const pts = series.filter(s => s.rec && s.rec.currentLow != null).map(s => ({date:s.date, y:s.rec.currentLow}));
    if (!pts.length){
      box.appendChild(el("div", {class:"empty-note"}, "이 상품의 가격 데이터가 아직 없어요"));
      return;
    }
    let floorVal = null;
    for (let i = series.length-1; i >= 0; i--){ if (series[i].rec && series[i].rec.floor != null){ floorVal = series[i].rec.floor; break; } }

    const W = 640, H = 240, padL = 62, padR = 16, padT = 20, padB = 30;
    const innerW = W - padL - padR, innerH = H - padT - padB;
    const values = pts.map(p => p.y).concat(floorVal != null ? [floorVal] : []);
    const rawMin = Math.min.apply(null, values), rawMax = Math.max.apply(null, values);
    const nice = niceScale(rawMin, rawMax, 4);
    const yMin = nice.min, yMax = nice.max;
    const x = i => padL + (pts.length === 1 ? innerW/2 : innerW * i / (pts.length - 1));
    const y = v => padT + innerH - ((v - yMin) / (yMax - yMin || 1)) * innerH;

    const svg = svgEl("svg", {viewBox:"0 0 " + W + " " + H, preserveAspectRatio:"xMidYMid meet"});

    // gridlines at nice round values
    nice.ticks.forEach(v=>{
      const gy = y(v);
      svg.appendChild(svgEl("line", {x1:padL, x2:W-padR, y1:gy, y2:gy, stroke:"var(--grid)", "stroke-width":1}));
      const lbl = svgEl("text", {x:padL-8, y:gy+3, "text-anchor":"end"});
      lbl.textContent = Math.round(v).toLocaleString("ko-KR");
      svg.appendChild(lbl);
    });

    // floor reference line
    if (floorVal != null && floorVal >= yMin && floorVal <= yMax){
      const fy = y(floorVal);
      svg.appendChild(svgEl("line", {x1:padL, x2:W-padR, y1:fy, y2:fy, stroke:"var(--critical)", "stroke-width":1.5, "stroke-dasharray":"4 4", opacity:0.7}));
      const flbl = svgEl("text", {x:W-padR, y:fy-6, "text-anchor":"end", fill:"var(--critical)"});
      flbl.textContent = "마지노선 " + Math.round(floorVal).toLocaleString("ko-KR") + "원";
      svg.appendChild(flbl);
    }

    // date labels
    pts.forEach((p,i)=>{
      const lbl = svgEl("text", {x:x(i), y:H-8, "text-anchor":"middle"});
      lbl.textContent = p.date.length > 7 ? p.date.slice(5) : p.date;
      svg.appendChild(lbl);
    });

    // line path
    const d = pts.map((p,i) => (i===0 ? "M" : "L") + x(i).toFixed(1) + "," + y(p.y).toFixed(1)).join(" ");
    svg.appendChild(svgEl("path", {d, fill:"none", stroke:"var(--accent)", "stroke-width":2, "stroke-linecap":"round", "stroke-linejoin":"round"}));

    // dots + end label
    pts.forEach((p,i)=>{
      svg.appendChild(svgEl("circle", {cx:x(i), cy:y(p.y), r:5, fill:"var(--accent)", stroke:"var(--surface)", "stroke-width":2}));
    });
    const last = pts[pts.length-1];
    const endLbl = svgEl("text", {x:x(pts.length-1), y:y(last.y)-12, "text-anchor":"middle", class:"value-label"});
    endLbl.textContent = Math.round(last.y).toLocaleString("ko-KR") + "원";
    svg.appendChild(endLbl);

    // hover crosshair
    const hitW = innerW / Math.max(pts.length-1,1);
    const crosshair = svgEl("line", {x1:0,x2:0,y1:padT,y2:H-padB, stroke:"var(--baseline)", "stroke-width":1, opacity:0});
    svg.appendChild(crosshair);
    const overlay = svgEl("rect", {x:padL, y:padT, width:innerW, height:innerH, fill:"transparent"});
    svg.appendChild(overlay);

    box.appendChild(svg);
    const tip = el("div", {class:"tooltip"});
    box.appendChild(tip);

    function showTip(i, clientRect){
      const p = pts[i];
      crosshair.setAttribute("x1", x(i)); crosshair.setAttribute("x2", x(i)); crosshair.setAttribute("opacity", 1);
      tip.innerHTML = "";
      tip.appendChild(el("div", {class:"t-date"}, p.date));
      tip.appendChild(el("div", {class:"t-val"}, Math.round(p.y).toLocaleString("ko-KR") + "원"));
      const scale = box.clientWidth / W;
      tip.style.left = (x(i) * scale) + "px";
      tip.style.top = (y(p.y) * scale) + "px";
      tip.style.opacity = 1;
    }
    overlay.addEventListener("pointermove", function(e){
      const rect = box.getBoundingClientRect();
      const scale = W / rect.width;
      const px = (e.clientX - rect.left) * scale;
      let i = Math.round((px - padL) / (hitW || 1));
      i = Math.max(0, Math.min(pts.length-1, i));
      showTip(i);
    });
    overlay.addEventListener("pointerleave", function(){ crosshair.setAttribute("opacity",0); tip.style.opacity = 0; });
  }

  // ---------- channel distribution chart ----------
  function renderChannelChart(){
    const box = document.getElementById("channelChart");
    box.innerHTML = "";
    const latest = state.snapshots[state.snapshots.length-1];
    const counts = CHANNELS.map(ch => ({ ch, count: latest.records.filter(r => r.lowChannel === ch).length }))
      .sort((a,b) => b.count - a.count);
    const max = Math.max.apply(null, counts.map(c => c.count).concat([1]));

    const W = 300, rowH = 34, padL = 66, padR = 36, padT = 6;
    const H = padT + rowH * counts.length + 6;
    const svg = svgEl("svg", {viewBox:"0 0 " + W + " " + H});
    counts.forEach((c,i)=>{
      const cy = padT + i*rowH + rowH/2;
      const barW = max ? (W - padL - padR) * (c.count / max) : 0;
      const label = svgEl("text", {x:padL-8, y:cy+4, "text-anchor":"end"});
      label.textContent = c.ch;
      svg.appendChild(label);
      svg.appendChild(svgEl("rect", {x:padL, y:cy-9, width:Math.max(barW,2), height:18, rx:4, fill:"var(" + CHANNEL_VAR[c.ch] + ")"}));
      const val = svgEl("text", {x:padL+barW+8, y:cy+4, class:"value-label"});
      val.textContent = c.count + "개";
      svg.appendChild(val);
    });
    box.appendChild(svg);
    if (counts.every(c => c.count === 0)) box.appendChild(el("div", {class:"empty-note"}, "최저채널 정보가 없어요"));
  }

  // ---------- category alert chart ----------
  function renderCategoryChart(){
    const box = document.getElementById("categoryChart");
    box.innerHTML = "";
    const latest = state.snapshots[state.snapshots.length-1];
    const hasCategory = latest.records.some(r => r.category);
    if (!hasCategory){
      box.appendChild(el("div", {class:"empty-note"}, "이 파일에는 카테고리 열이 없어요"));
      return;
    }
    const byCat = {};
    latest.records.forEach(r=>{
      if (!isAlert(r)) return;
      const cat = r.category || "미분류";
      byCat[cat] = (byCat[cat] || 0) + 1;
    });
    const entries = Object.keys(byCat).map(k => ({cat:k, count:byCat[k]})).sort((a,b) => b.count - a.count);
    if (!entries.length){
      box.appendChild(el("div", {class:"empty-note"}, "카테고리별 경고 상품이 없어요"));
      return;
    }
    const max = Math.max.apply(null, entries.map(e => e.count));
    const W = 300, rowH = 30, padL = 96, padR = 36, padT = 6;
    const H = padT + rowH * entries.length + 6;
    const svg = svgEl("svg", {viewBox:"0 0 " + W + " " + H});
    entries.forEach((e,i)=>{
      const cy = padT + i*rowH + rowH/2;
      const barW = (W - padL - padR) * (e.count / max);
      const label = svgEl("text", {x:padL-8, y:cy+4, "text-anchor":"end"});
      label.textContent = e.cat.length > 12 ? e.cat.slice(0,12)+"…" : e.cat;
      svg.appendChild(label);
      svg.appendChild(svgEl("rect", {x:padL, y:cy-8, width:Math.max(barW,2), height:16, rx:4, fill:"var(--ch-own)"}));
      const val = svgEl("text", {x:padL+barW+8, y:cy+4, class:"value-label"});
      val.textContent = e.count + "건";
      svg.appendChild(val);
    });
    box.appendChild(svg);
  }

  function renderAll(){
    renderKPIs();
    renderTable();
    renderAlerts();
    renderTrendChart();
    renderChannelChart();
    renderCategoryChart();
  }

  populateProductSelect();
  renderAll();
  loadSnapshotFromServer();
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function(){
    renderTrendChart(); renderChannelChart(); renderCategoryChart();
  });
})();
</script>
</body>
</html>
