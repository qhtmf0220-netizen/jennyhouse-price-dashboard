<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>제니하우스 최저가 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Sans+KR:wght@500;600;700&display=swap">
<style>
/* Layout: one working column — header, summary strip, floor alerts, product grid, product drill-down */
:root{
  --bg:#f7f5f6; --surface:#ffffff; --surface-2:#f1edef; --line:#e4dde0; --line-2:#d3c9ce;
  --ink:#231c20; --ink-2:#5b5056; --ink-3:#8d8288;
  --accent:#b23a63; --accent-wash:rgba(178,58,99,.08);
  --bad:#c8352f; --bad-wash:rgba(200,53,47,.10); --warn:#b77a00; --warn-wash:rgba(183,122,0,.12);
  --good:#23835a; --good-wash:rgba(35,131,90,.10); --muted-wash:rgba(141,130,136,.12);
  --ch-own:#b23a63; --ch-oy:#7cae1f; --ch-cp:#2f6fd6; --ch-nv:#03a65a;
  --f-head:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141113; --surface:#1d191b; --surface-2:#262124; --line:#332c30; --line-2:#463d42;
  --ink:#f3eef0; --ink-2:#c4b9be; --ink-3:#8f848a;
  --accent:#e07a9c; --accent-wash:rgba(224,122,156,.12);
  --bad:#ef7a73; --bad-wash:rgba(239,122,115,.14); --warn:#e5b04a; --warn-wash:rgba(229,176,74,.14);
  --good:#5fc596; --good-wash:rgba(95,197,150,.13); --muted-wash:rgba(143,132,138,.16);
  --ch-own:#e07a9c; --ch-oy:#a5d150; --ch-cp:#6ea0f0; --ch-nv:#3fcf87; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141113; --surface:#1d191b; --surface-2:#262124; --line:#332c30; --line-2:#463d42;
  --ink:#f3eef0; --ink-2:#c4b9be; --ink-3:#8f848a;
  --accent:#e07a9c; --accent-wash:rgba(224,122,156,.12);
  --bad:#ef7a73; --bad-wash:rgba(239,122,115,.14); --warn:#e5b04a; --warn-wash:rgba(229,176,74,.14);
  --good:#5fc596; --good-wash:rgba(95,197,150,.13); --muted-wash:rgba(143,132,138,.16);
  --ch-own:#e07a9c; --ch-oy:#a5d150; --ch-cp:#6ea0f0; --ch-nv:#3fcf87; color-scheme:dark }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
.wrap{max-width:1280px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-head);margin:0;text-wrap:balance}
h1{font-size:21px;font-weight:700;letter-spacing:-.01em}
h2{font-size:15px;font-weight:700}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:flex-end;justify-content:space-between}
.sub{color:var(--ink-3);font-size:12.5px;margin-top:3px}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input[type=search]{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:7px 10px}
input[type=search]{width:170px}
label.lab{font-size:12px;color:var(--ink-3)}

.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.stat{padding:14px 16px;display:flex;flex-direction:column;gap:2px;border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat .k{font-size:12px;color:var(--ink-3)}
.stat .v{font-family:var(--f-head);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .d{font-size:12px;color:var(--ink-2)}
.stat.bad .v{color:var(--bad)} .stat.warn .v{color:var(--warn)}

.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.panel-h .hint{font-size:12px;color:var(--ink-3)}

.alerts{display:flex;flex-direction:column;gap:6px;max-height:330px;overflow:auto}
.al{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:9px 11px;border-radius:8px;background:var(--bad-wash);cursor:pointer;border:1px solid transparent;text-align:left;font:inherit;color:inherit}
.al:hover{border-color:var(--bad)}
.al .n{font-weight:600;font-size:13px}
.al .g{color:var(--bad);font-weight:700;font-variant-numeric:tabular-nums;font-size:13px}
.al .m{grid-column:1/-1;font-size:12px;color:var(--ink-2);display:flex;gap:10px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.empty{color:var(--ink-3);font-size:13px;padding:14px 2px}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--ink-3));flex:none}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.bad{color:var(--bad);background:var(--bad-wash)} .pill.warn{color:var(--warn);background:var(--warn-wash)}
.pill.good{color:var(--good);background:var(--good-wash)} .pill.muted{color:var(--ink-3);background:var(--muted-wash)}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{position:sticky;top:0;background:var(--surface-2);font-size:11.5px;font-weight:600;color:var(--ink-2);text-align:left;white-space:nowrap;letter-spacing:.02em;cursor:pointer;user-select:none}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--accent-wash)}
tbody tr.sel{background:var(--accent-wash);box-shadow:inset 3px 0 0 var(--accent)}
td.name{min-width:220px}
td.name .c{display:block;font-size:11.5px;color:var(--ink-3)}
.cell{display:flex;flex-direction:column;align-items:flex-end;line-height:1.25}
.cell .q{font-size:11px;color:var(--ink-3)}
.cell.low .v{font-weight:700}
.cell.below .v{color:var(--bad)}
.cell.na{color:var(--ink-3)}
.delta{font-size:11.5px;font-variant-numeric:tabular-nums}
.delta.dn{color:var(--bad)} .delta.up{color:var(--good)} .delta.eq{color:var(--ink-3)}

.detail{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px}
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--ink-3);font-size:10.5px;font-family:var(--f-body)}
.opt-wrap{overflow:auto;max-height:420px}
.opt-wrap table{font-size:12.5px}
.opt-wrap th{cursor:default}
.opt-wrap td.o{min-width:160px;color:var(--ink-2)}
tr.sold td{color:var(--ink-3);text-decoration:line-through}
.src{font-size:11px;color:var(--ink-3)}
.notes{font-size:12.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
footer{font-size:12px;color:var(--ink-3);line-height:1.7}

@media (max-width:900px){ .grid2,.detail{grid-template-columns:minmax(0,1fr)} }
@media (max-width:640px){ .strip{grid-template-columns:repeat(2,minmax(0,1fr))} .stat:nth-child(3){border-left:0} .stat:nth-child(n+3){border-top:1px solid var(--line)} input[type=search]{width:130px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <h1>제니하우스 최저가 대시보드</h1>
      <div class="sub" id="subLine">데이터를 불러오는 중…</div>
    </div>
    <div class="ctrl">
      <label class="lab" for="dateSel">기준일</label>
      <select id="dateSel"></select>
    </div>
  </header>

  <section class="strip" id="strip"></section>

  <section class="grid2">
    <div class="panel">
      <div class="panel-h"><h2>마지노선 이하</h2><span class="hint">개당가 기준 · 차이 큰 순</span></div>
      <div class="alerts" id="alerts"></div>
    </div>
    <div class="panel">
      <div class="panel-h"><h2>지난 수집 대비 변동</h2><span class="hint" id="chgHint"></span></div>
      <div class="alerts" id="changes"></div>
    </div>
  </section>

  <section class="panel" style="padding:0;border:0;background:none">
    <div class="panel-h">
      <h2>상품별 채널 최저 개당가</h2>
      <div class="ctrl">
        <input type="search" id="q" placeholder="상품명 검색">
        <select id="catSel"><option value="">전체 카테고리</option></select>
        <select id="stSel"><option value="">전체 상태</option><option value="bad">마지노선 이하</option><option value="warn">근접(3% 이내)</option><option value="miss">미수집 채널 있음</option></select>
      </div>
    </div>
    <div class="chips" id="legend"></div>
    <div class="tbl-wrap">
      <table id="tbl">
        <thead><tr>
          <th data-k="no" class="num">No.</th><th data-k="name">상품명</th><th data-k="floor" class="num">마지노선</th><th data-k="oy" class="num">올영세일가</th>
          <th data-k="min" class="num">현재 최저</th><th data-k="st">상태</th>
          <th data-k="자사몰" class="num">자사몰</th><th data-k="올리브영" class="num">올리브영</th><th data-k="쿠팡" class="num">쿠팡</th><th data-k="네이버" class="num">네이버</th>
          <th data-k="delta" class="num">지난 수집 대비</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </section>

  <section class="panel" id="detail">
    <div class="panel-h"><h2 id="dTitle">상품 상세</h2><span class="hint" id="dHint">표에서 상품을 누르면 추이와 전체 판매 구성이 보여요</span></div>
    <div class="detail">
      <div class="chart" id="chart"></div>
      <div class="opt-wrap"><table><thead><tr><th>채널</th><th>판매 구성</th><th class="num">수량</th><th class="num">판매가</th><th class="num">개당가</th></tr></thead><tbody id="optBody"></tbody></table></div>
    </div>
    <div class="notes" id="notes"></div>
  </section>

  <footer id="foot"></footer>
</div>

<script>
(function(){
"use strict";
const CH = ["자사몰","올리브영","쿠팡","네이버"];
const CHV = {"자사몰":"--ch-own","올리브영":"--ch-oy","쿠팡":"--ch-cp","네이버":"--ch-nv"};
// 올리브영 세일 할인가 (기존 대시보드에서 쓰던 고정값, 상품명 기준)
const OY_SALE = {"제니하우스 살롱테라피 데미지케어 샴푸 500ml":18050,"제니하우스 살롱테라피 데미지케어 트리트먼트 240ml":11970,"제니하우스 살롱테라피 데미지케어 헤어오일세럼 100ml":17480,"제니하우스 루트 볼륨 픽서 200ml":14210,"제니하우스 스타일 컬링 세럼150ml":9980,"제니하우스 실크 케어 에센스 미스트 200ml":15200,"제니하우스 인텐시브 노워시 엔젤링크림150ml":10800,"제니하우스 히팅케어 퀵 드라이 미스트200ml":14440,"제니하우스 셀프업 헤어커버 마스카라 01내추럴브라운_8ml":9120,"제니하우스 셀프업 헤어커버 마스카라 02다크브라운_8ml":9120,"제니하우스 셀프업 헤어커버 마스카라 03블랙_8ml":9120,"제니하우스 셀프업 헤어라인 브러쉬 01. 내추럴브라운":11310,"제니하우스 셀프업 헤어라인 브러쉬 02. 다크브라운":11310,"제니하우스 프리미엄 헤어컬러 블랙 1N":8010,"제니하우스 프리미엄 헤어컬러 다크브라운 5NB":8010,"제니하우스 프리미엄 헤어컬러 내츄럴브라운 6NB":8010,"제니하우스 프리미엄 헤어컬러 로즈골드브라운 7RB":8010,"제니하우스 프리미엄 헤어컬러 핑크브라운 11PB":8010,"제니하우스 프리미엄 헤어컬러 애쉬브라운 11AB":8010,"제니하우스 프리미엄 헤어컬러 애쉬누드베이지 12AND":8010,"제니하우스 프리미엄 헤어컬러 애쉬블루 7ABL":8010,"제니하우스 프리미엄 헤어컬러 애쉬빈티지카키 6AK":8010,"제니하우스 프리미엄 헤어컬러 브릭오렌지 9BO":8010,"제니하우스 프리미엄 헤어컬러 페이크블랙 1FK":8010};
const normName = s => String(s||"").replace(/[\u200b\u200c\u200d\ufeff]/g,"").replace(/\s+/g," ").trim();
const OY_SALE_N = {}; Object.keys(OY_SALE).forEach(k => OY_SALE_N[normName(k)] = OY_SALE[k]);
const oySale = name => OY_SALE_N[normName(name)] ?? null;
const won = n => n==null||isNaN(n) ? "-" : Math.round(n).toLocaleString("ko-KR");
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = id => document.getElementById(id);
let D, rows, prods, dates, cur, sel = null, sort = {k:"st", dir:1};

function idx(){
  // best[date][no][ch] = row with min unit (not sold out)
  const best = {}, all = {};
  for (const r of rows){
    const [date,no,ch,,,,,unit,sold] = r;
    (all[date] ||= {}); (all[date][no] ||= []).push(r);
    if (sold) continue;
    const b = ((best[date] ||= {})[no] ||= {});
    if (!b[ch] || unit < b[ch][7]) b[ch] = r;
  }
  return {best, all};
}
let IX;
function stateOf(p, min){
  if (min == null) return {k:"miss", t:"미수집", o:3};
  if (p.floor == null) return {k:"muted", t:"기준 없음", o:4};
  if (min < p.floor) return {k:"bad", t:"마지노선 이하", o:0};
  if (min < p.floor*1.03) return {k:"warn", t:"근접", o:1};
  return {k:"good", t:"정상", o:2};
}
function summary(date){
  const b = (IX.best[date]||{});
  return prods.map(p => {
    const per = b[p.no] || {};
    let min = null, minCh = null;
    for (const c of CH){ const r = per[c]; if (r && (min==null || r[7] < min)){ min = r[7]; minCh = c; } }
    const missing = CH.filter(c => p.links[c] && !per[c]);
    return {p, per, min, minCh, st: stateOf(p,min), missing};
  });
}
function prevDate(date){ const i = dates.indexOf(date); return i > 0 ? dates[i-1] : null; }

function render(){
  const S = summary(cur), pd = prevDate(cur), SP = pd ? summary(pd) : null;
  const prevMin = {}; if (SP) SP.forEach(s => prevMin[s.p.no] = s.min);
  S.forEach(s => s.delta = (s.min!=null && prevMin[s.p.no]!=null) ? s.min - prevMin[s.p.no] : null);
  const srcs = new Set((IX.all[cur] ? Object.values(IX.all[cur]).flat() : []).map(r => r[3]));
  $("subLine").textContent = `기준일 ${cur} · ${srcs.has("기존엑셀") ? "수기 입력 기록" : "어사이드 자동 수집"} · 데이터 갱신 ${D.generated}`;

  const nb = S.filter(s=>s.st.k==="bad").length, nw = S.filter(s=>s.st.k==="warn").length;
  const pb = SP ? SP.filter(s=>s.st.k==="bad").length : null;
  const nchg = S.filter(s=>s.delta).length;
  const nmiss = S.reduce((a,s)=>a+s.missing.length,0);
  $("strip").innerHTML = [
    ["모니터링 상품", S.length, `채널 페이지 ${S.reduce((a,s)=>a+CH.filter(c=>s.p.links[c]).length,0)}개`, ""],
    ["마지노선 이하", nb, pb==null ? "" : (nb===pb ? "지난 수집과 같음" : `지난 수집 ${pb}건 → ${nb}건`), nb ? "bad":""],
    ["근접 (3% 이내)", nw, "마지노선 바로 위", nw ? "warn":""],
    ["최저가 변동", nchg, pd ? `${pd} 대비` : "비교할 이전 수집 없음", ""],
  ].map(([k,v,d,c]) => `<div class="stat ${c}"><span class="k">${k}</span><span class="v">${v}</span><span class="d">${esc(d)}</span></div>`).join("");

  const al = S.filter(s=>s.st.k==="bad").sort((a,b)=>(a.min/a.p.floor)-(b.min/b.p.floor));
  $("alerts").innerHTML = al.length ? al.map(s => {
    const r = s.per[s.minCh];
    return `<button class="al" data-no="${s.p.no}"><span class="n">${esc(s.p.name)}</span><span class="g">-${won(s.p.floor - s.min)}원</span>
      <span class="m"><span class="chip"><span class="dot" style="--c:var(${CHV[s.minCh]})"></span>${s.minCh}</span><span>개당 ${won(s.min)}원 (${r[5]}개 ${won(r[6])}원)</span><span>마지노선 ${won(s.p.floor)}원</span></span></button>`;
  }).join("") : `<div class="empty">마지노선 아래로 내려간 상품이 없어요.</div>`;

  $("chgHint").textContent = pd ? `${pd} → ${cur}` : "";
  const ch = S.filter(s=>s.delta).sort((a,b)=>a.delta-b.delta);
  $("changes").innerHTML = !pd ? `<div class="empty">이전 수집이 없어서 비교할 수 없어요.</div>` : ch.length ? ch.map(s =>
    `<button class="al" style="background:${s.delta<0?"var(--bad-wash)":"var(--good-wash)"}" data-no="${s.p.no}"><span class="n">${esc(s.p.name)}</span><span class="g" style="color:${s.delta<0?"var(--bad)":"var(--good)"}">${s.delta>0?"+":""}${won(s.delta)}원</span>
     <span class="m"><span>${won(prevMin[s.p.no])} → ${won(s.min)}원</span><span class="chip"><span class="dot" style="--c:var(${CHV[s.minCh]})"></span>${s.minCh}</span></span></button>`).join("")
    : `<div class="empty">지난 수집과 최저가가 같아요.</div>`;

  // table
  const q = $("q").value.trim(), cat = $("catSel").value, st = $("stSel").value;
  let T = S.filter(s => (!q || s.p.name.includes(q)) && (!cat || s.p.cat===cat) && (!st || (st==="miss" ? s.missing.length : s.st.k===st)));
  const kf = {oy:s=>oySale(s.p.name)??1e12, no:s=>s.p.no, name:s=>s.p.name, floor:s=>s.p.floor??-1, min:s=>s.min??1e12, st:s=>s.st.o*1000+(s.p.floor&&s.min?s.min/s.p.floor:9), delta:s=>s.delta??0};
  CH.forEach(c => kf[c] = s => s.per[c] ? s.per[c][7] : 1e12);
  const f = kf[sort.k] || kf.no;
  T.sort((a,b)=>{ const x=f(a), y=f(b); return (typeof x==="string" ? x.localeCompare(y,"ko") : x-y)*sort.dir || a.p.no-b.p.no; });
  $("tbody").innerHTML = T.map(s => {
    const cells = CH.map(c => {
      if (!s.p.links[c]) return `<td class="num"><span class="cell na">미취급</span></td>`;
      const r = s.per[c];
      if (!r) return `<td class="num"><span class="cell na"><span class="pill muted">미수집</span></span></td>`;
      const below = s.p.floor!=null && r[7] < s.p.floor;
      return `<td class="num"><span class="cell ${c===s.minCh?"low":""} ${below?"below":""}"><span class="v">${won(r[7])}</span><span class="q">${String(r[3]).startsWith("직전값")?`<span class="pill muted">${esc(r[3])}</span>`:(r[5]>1?`${r[5]}개 ${won(r[6])}`:"1개")}</span></span></td>`;
    }).join("");
    const d = s.delta;
    const dcell = d==null ? `<span class="delta eq">-</span>` : d===0 ? `<span class="delta eq">변동 없음</span>` : `<span class="delta ${d<0?"dn":"up"}">${d>0?"+":""}${won(d)}</span>`;
    return `<tr data-no="${s.p.no}" class="${sel===s.p.no?"sel":""}"><td class="num">${s.p.no}</td><td class="name">${esc(s.p.name)}<span class="c">${esc(s.p.cat)}</span></td>
      <td class="num">${s.p.floor!=null?won(s.p.floor):`<span class="pill muted">미설정</span>`}</td><td class="num">${oySale(s.p.name)!=null?won(oySale(s.p.name)):"-"}</td>
      <td class="num"><span class="cell low ${s.st.k==="bad"?"below":""}"><span class="v">${won(s.min)}</span><span class="q">${s.minCh||""}</span></span></td>
      <td><span class="pill ${s.st.k==="miss"?"muted":s.st.k}">${s.st.t}</span></td>${cells}<td class="num">${dcell}</td></tr>`;
  }).join("") || `<tr><td colspan="11" class="empty">조건에 맞는 상품이 없어요.</td></tr>`;
  document.querySelectorAll("#tbl th").forEach(th => { th.textContent = th.textContent.replace(/ [▲▼]$/,""); if (th.dataset.k===sort.k) th.textContent += sort.dir>0?" ▲":" ▼"; });

  renderDetail(S);
  const n = D.notes || {};
  $("foot").innerHTML = `개당가 = 판매가 ÷ 구성수량. 각 채널에서 품절이 아닌 판매 구성 중 가장 싼 개당가를 보여줘요. 상태: 마지노선 미만 = 이하, 마지노선 ~ +3% = 근접.<br>매일 09:30 어사이드로 자동 수집해요. 수집에 실패한 채널은 직전 수집값으로 채우고 "직전값" 표시를 붙여요. 원천 로우데이터: 공용 드라이브 6. 국내 영업\\00.공용\\★국내영업_최저가RAW.xlsx · 2026-11-13 이전은 기존 수기 엑셀에서 옮긴 값이에요.`;
}

function renderDetail(S){
  if (sel==null){ const first = S.find(s=>s.st.k==="bad") || S[0]; sel = first && first.p.no; }
  const s = S.find(x=>x.p.no===sel); if (!s) return;
  document.querySelectorAll("#tbody tr").forEach(tr => tr.classList.toggle("sel", +tr.dataset.no===sel));
  $("dTitle").textContent = s.p.name;
  $("dHint").innerHTML = CH.filter(c=>s.p.links[c]).map(c=>`<a href="${s.p.links[c]}" target="_blank" rel="noopener">${c}</a>`).join(" · ");
  // option rows
  const list = ((IX.all[cur]||{})[sel]||[]).slice().sort((a,b)=>CH.indexOf(a[2])-CH.indexOf(b[2]) || a[7]-b[7]);
  $("optBody").innerHTML = list.length ? list.map(r => `<tr class="${r[8]?"sold":""}"><td><span class="chip"><span class="dot" style="--c:var(${CHV[r[2]]})"></span>${r[2]}</span></td>
    <td class="o">${r[9]?`<a href="${esc(r[9])}" target="_blank" rel="noopener">${esc(r[4]||"기본")}</a>`:esc(r[4]||"기본")}${r[3]==="연관"?' <span class="src">다른 판매 상품</span>':""}${r[8]?' <span class="src">품절</span>':""}</td>
    <td class="num">${r[5]}</td><td class="num">${won(r[6])}</td><td class="num"><b>${won(r[7])}</b></td></tr>`).join("") : `<tr><td colspan="5" class="empty">이 날짜에는 수집된 값이 없어요.</td></tr>`;
  drawChart(s.p);
  const nt = (D.notes||{})[String(sel)] || [];
  $("notes").innerHTML = nt.map(t=>`<div>· ${esc(t)}</div>`).join("");
}

function drawChart(p){
  const W=640,H=250,L=56,R=70,T=16,B=28, iw=W-L-R, ih=H-T-B;
  const series = CH.map(c => ({c, pts: dates.map((d,i)=>{ const r=((IX.best[d]||{})[p.no]||{})[c]; return r?{i,v:r[7]}:null; }).filter(Boolean)})).filter(s=>s.pts.length);
  const vals = series.flatMap(s=>s.pts.map(x=>x.v)).concat(p.floor!=null?[p.floor]:[]);
  if (!vals.length){ $("chart").innerHTML = `<div class="empty">추이 데이터가 없어요.</div>`; return; }
  let lo=Math.min(...vals), hi=Math.max(...vals); if (lo===hi){lo-=500;hi+=500;}
  const span=hi-lo, raw=span/4, mag=Math.pow(10,Math.floor(Math.log10(raw))), st=[1,2,5,10].map(m=>m*mag).find(s=>s>=raw);
  lo=Math.floor(lo/st)*st; hi=Math.ceil(hi/st)*st;
  const x=i=> L + (dates.length===1? iw/2 : iw*i/(dates.length-1)), y=v=> T+ih-(v-lo)/(hi-lo)*ih;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="채널별 최저 개당가 추이">`;
  for (let v=lo; v<=hi+1e-6; v+=st) s += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+3.5}" text-anchor="end">${won(v)}</text>`;
  const every = Math.ceil(dates.length/7);
  dates.forEach((d,i)=>{ if (i%every===0 || i===dates.length-1) s += `<text x="${x(i)}" y="${H-8}" text-anchor="middle">${d.slice(5).replace("-","/")}</text>`; });
  const ci = dates.indexOf(cur); s += `<line x1="${x(ci)}" x2="${x(ci)}" y1="${T}" y2="${T+ih}" stroke="var(--line-2)" stroke-dasharray="2 3"/>`;
  if (p.floor!=null) s += `<line x1="${L}" x2="${W-R}" y1="${y(p.floor)}" y2="${y(p.floor)}" stroke="var(--bad)" stroke-width="1.4" stroke-dasharray="5 4"/><text x="${W-R+6}" y="${y(p.floor)+3.5}" style="fill:var(--bad)">마지노선</text>`;
  const ends=[];
  series.forEach(se=>{
    const col=`var(${CHV[se.c]})`;
    s += `<path d="${se.pts.map((q,k)=>(k?"L":"M")+x(q.i).toFixed(1)+","+y(q.v).toFixed(1)).join(" ")}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    se.pts.forEach(q=> s += `<circle cx="${x(q.i)}" cy="${y(q.v)}" r="${q.i===ci?4:2.4}" fill="${col}"><title>${se.c} ${dates[q.i]} ${won(q.v)}원</title></circle>`);
    const last=se.pts[se.pts.length-1]; ends.push({c:se.c,col,yv:y(last.v),v:last.v});
  });
  ends.sort((a,b)=>a.yv-b.yv); for (let k=1;k<ends.length;k++) if (ends[k].yv-ends[k-1].yv<12) ends[k].yv=ends[k-1].yv+12;
  ends.forEach(e=> s += `<text x="${W-R+6}" y="${e.yv+3.5}" style="fill:${e.col};font-weight:600">${e.c} ${won(e.v)}</text>`);
  $("chart").innerHTML = s + `</svg>`;
}

function boot(data){
  D = data; rows = D.rows; prods = D.products; IX = idx();
  dates = Object.keys(IX.all).sort(); cur = dates[dates.length-1];
  $("dateSel").innerHTML = dates.slice().reverse().map(d=>`<option value="${d}">${d}</option>`).join("");
  $("catSel").innerHTML += [...new Set(prods.map(p=>p.cat))].map(c=>`<option>${esc(c)}</option>`).join("");
  $("legend").innerHTML = CH.map(c=>`<span class="chip"><span class="dot" style="--c:var(${CHV[c]})"></span>${c}</span>`).join("") + `<span class="chip">· 굵은 값 = 그 상품의 현재 최저 · 빨간 값 = 마지노선 이하 · 작은 글씨 = 최저가가 나온 판매 구성</span>`;
  $("dateSel").onchange = e => { cur = e.target.value; render(); };
  ["q","catSel","stSel"].forEach(id => $(id).addEventListener("input", render));
  document.querySelectorAll("#tbl th").forEach(th => th.onclick = () => { const k=th.dataset.k; sort = {k, dir: sort.k===k ? -sort.dir : 1}; render(); });
  document.addEventListener("click", e => { const t = e.target.closest("[data-no]"); if (t && !e.target.closest("a")){ sel = +t.dataset.no; renderDetail(summary(cur)); if (t.classList.contains("al")) $("detail").scrollIntoView({behavior:"smooth",block:"start"}); } });
  render();
}
fetch("/api/data",{cache:"no-store"}).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(boot)
  .catch(err => { $("subLine").textContent = "최저가 데이터를 불러오지 못했어요. 잠시 후 새로고침해 보세요. (" + err.message + ")"; });
})();
</script>
</body>
